plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chatscopex.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.chatscopex.app"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "0.5.0"
        // Address of the Cloudflare Worker (see backend/wrangler.toml). Change it if you rename the Worker.
        buildConfigField "String", "API_BASE", "\"https://broad-unit-e632.zmalqpgg7777.workers.dev\""
    }

    buildFeatures {
        buildConfig true
    }

    // A fixed debug key (public on purpose, debug builds only) so each new build installs over the old one.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Versions below are from my own knowledge, NOT verified against the repositories from my environment.
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // WebRTC for voice and video calls (Google's build, on Maven Central).
    implementation 'org.webrtc:google-webrtc:1.0.32006'
}
